<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard - NovaCart</title>
    <link rel="stylesheet" href="../CSS/sellerstyle.css">
</head>

<body>
    <div class="container">

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">NovaCart</div>
            <a href="sellerdashboard.html" class="active">Dashboard</a>
            <a href="sellerproducts.html">Products &amp; Inventory</a>
            <a href="sellerorders.html">Orders</a>
            <a href="sellerpromotions.html">Sales &amp; Promotion</a>
            <a href="sellerprofile.html">My Profile</a>
        </div>

        <!-- Main content -->
        <main class="main">

            <!-- Header -->
            <div class="page-header">
                <div>
                    <h1>Welcome back, <span id="welcomeName">Mahir</span>!</h1>
                    <p class="muted">Here is your store overview.</p>
                </div>

                <div class="header-right">
                    <button type="button" class="notif-btn" id="notifBtn">🔔<span class="badge" id="notifBadge" style="display:none">0</span></button>
                    <div class="notif-panel" id="notifPanel">
                        <h3>Notifications</h3>
                        <div id="notifList"></div>
                    </div>
                    <a href="sellerprofile.html" class="avatar small" id="headerAvatar" title="My Profile"></a>
                    <button type="button" class="secondary" id="logoutBtn">Logout</button>
                </div>
            </div>

            <!-- Summary cards -->
            <section class="cards">
                <div class="card">
                    <h2>Total Orders</h2>
                    <div class="number" id="totalOrders">0</div>
                </div>
                <div class="card">
                    <h2>Products Listed</h2>
                    <div class="number" id="totalProducts">3</div>
                </div>
                <div class="card">
                    <h2>Promotion Requests</h2>
                    <div class="number" id="totalPromotions">0</div>
                </div>
                <div class="card">
                    <h2>Store Rating</h2>
                    <div class="number">4.8 / 5</div>
                </div>
            </section>

            <!-- Tasks -->
            <section class="panel">
                <h2>My Tasks</h2>

                <form id="taskForm">
                    <div class="form-grid">
                        <div>
                            <label>Task</label>
                            <input id="taskName" required placeholder="Update product stock">
                        </div>
                        <div>
                            <label>Due Date</label>
                            <input id="taskDate" type="date">
                        </div>
                    </div>
                    <button id="taskButton">Add Task</button>
                    <button type="button" class="secondary" id="cancelTask" style="display:none">Cancel</button>
                </form>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Task</th>
                                <th>Due Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="taskTable"></tbody>
                    </table>
                </div>
            </section>
        </main>

    </div>

    <script src="../JS/sellerdashboard.js"></script>
</body>

</html>
